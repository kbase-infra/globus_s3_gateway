version: '3.8'

services:
  bootstrap:
    image: ${GCS_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    profiles:
      - bootstrap
    volumes:
      - gcs-config:/gcs-config
      - gcs-state:/var/lib/globus-connect-server
      - gcs-logs:/var/log/globus-connect-server
    environment:
      - GCS_ADMIN_IDENTITY
      - GCS_ORG
      - GCS_CONTACT_EMAIL
      - GCS_DISPLAY_NAME
    entrypoint: ["/bootstrap.sh"]

  globus:
    image: ${GCS_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    volumes:
      - gcs-config:/gcs-config:ro
      - gcs-state:/var/lib/globus-connect-server
      - gcs-logs:/var/log/globus-connect-server
    environment:
      - GCS_ADMIN_IDENTITY
      - GCS_ORG
      - GCS_CONTACT_EMAIL
      - GCS_DISPLAY_NAME
      - GCS_LOG_LEVEL
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  gcs-config:
  gcs-state:
  gcs-logs:
